services:
  - type: web
    name: tidyups-cleaning
    runtime: node
    region: oregon
    plan: starter
    buildCommand: npm install && npm run build
    startCommand: node dist/server.cjs
    healthCheckPath: /api/health
    envVars:
      - key: NODE_ENV
        value: production
      - key: ACTIVE_PROJECT_ID
        value: tidyups
