    <script>
      // Suppress Vite HMR WebSocket notices in proxied iframe environments
      window.addEventListener('unhandledrejection', function(event) {
        if (event && event.reason && String(event.reason.message || event.reason).includes('WebSocket closed without opened')) {
          event.preventDefault();
        }
      });
    </script>
